<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KataTira | Tournaments, Competitions & Relief Hub of Nepal</title>
    <meta name="theme-color" content="#f97316" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='16' fill='%23f97316'/><path d='M9 10h14v3c0 3.86-3.14 7-7 7s-7-3.14-7-7v-3zm3 2v1c0 2.21 1.79 4 4 4s4-1.79 4-4v-1h-8zm4 8v3h-4v2h10v-2h-4v-3h-2z' fill='white'/></svg>" />
    
    <!-- OpenGraph Social Sharing Cards (WhatsApp, Facebook, LinkedIn) -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="KataTira | Tournaments, Competitions & Relief Hub of Nepal" />
    <meta property="og:description" content="Discover, register, and host sports tournaments, debate MUNs, case competitions, and verified disaster relief initiatives across Nepal." />
    <meta property="og:site_name" content="KataTira Nepal" />
    <meta property="og:locale" content="en_US" />
    
    <!-- Twitter / X Cards -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="KataTira | Tournaments, Competitions & Relief Hub of Nepal" />
    <meta name="twitter:description" content="Discover, register, and host sports tournaments, debate MUNs, case competitions, and verified disaster relief initiatives across Nepal." />

    <!-- Schema.org JSON-LD Structured Data for Tournament Catalogue -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "KataTira",
      "description": "Nepal's premier tournament, competition, and relief discovery platform for sports, MUNs, and charity drives.",
      "inLanguage": "en",
      "potentialAction": {
        "@type": "SearchAction",
        "target": "/?search={search_term_string}",
        "query-input": "required name=search_term_string"
      }
    }
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800;900&family=Plus+Jakarta+Sans:wght@600;700;800&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  </head>
  <body class="bg-slate-50 text-slate-900 antialiased selection:bg-orange-500 selection:text-white min-h-screen font-sans">
    <div id="root">
      <!-- Fallback shown if JavaScript bundle is blocked or fails to load from the hosting server -->
      <div id="initial-loading-fallback" style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:#0f172a;color:#f8fafc;font-family:sans-serif;padding:24px;text-align:center;">
        <div style="max-width:440px;background:#1e293b;border:1px solid #334155;border-radius:24px;padding:32px;box-shadow:0 20px 25px -5px rgba(0,0,0,0.5);">
          <div style="width:48px;height:48px;border-radius:14px;background:#f97316;color:#ffffff;display:inline-flex;align-items:center;justify-content:center;font-weight:900;font-size:20px;margin-bottom:16px;">KT</div>
          <h2 style="font-size:20px;font-weight:800;margin:0 0 8px 0;color:#ffffff;">KataTira Nepal</h2>
          <p id="initial-loading-text" style="font-size:13px;color:#94a3b8;line-height:1.5;margin:0 0 16px 0;">Loading tournaments and competitions...</p>
          <div id="initial-error-details" style="display:none;background:#090d16;border:1px solid #e11d48;border-radius:12px;padding:12px;text-align:left;font-family:monospace;font-size:11px;color:#fda4af;margin-bottom:16px;word-break:break-all;"></div>
          <button id="initial-error-btn" style="display:none;width:100%;padding:10px 16px;background:#f97316;color:#ffffff;border:none;border-radius:12px;font-weight:700;font-size:12px;cursor:pointer;" onclick="location.reload()">Reload Page</button>
        </div>
      </div>
    </div>
    <script>
      // Capture any asset loading or execution failures so the screen is never blank
      window.addEventListener('error', function(e) {
        var el = document.getElementById('initial-error-details');
        var txt = document.getElementById('initial-loading-text');
        var btn = document.getElementById('initial-error-btn');
        if (el && txt && btn) {
          txt.textContent = 'Failed to load script or resource:';
          txt.style.color = '#fb7185';
          el.style.display = 'block';
          btn.style.display = 'block';
          el.textContent = (e && e.message ? e.message : (e && e.target && e.target.src ? 'Could not load: ' + e.target.src : 'Script loading error'));
        }
      }, true);
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
